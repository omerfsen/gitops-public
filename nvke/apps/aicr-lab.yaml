# The GPU stack of the NVKE lab cluster: NVIDIA AI Cluster Runtime's nvke
# recipe with the lab's overrides, rendered as an Argo CD Helm chart into
# nvke/aicr/lab by omerfsen.aicr's gitops playbook. This Application watches
# that path; the chart renders one child Application per component.
#
#   kubectl apply -f nvke/apps/aicr-lab.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aicr-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/omerfsen/gitops-public.git
    targetRevision: main
    path: nvke/aicr/lab
    helm:
      releaseName: aicr-lab
      valuesObject:
        deployer:
          # This Application is the root; the chart renders only the
          # children, so the two do not fight over them.
          includeRootApp: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
