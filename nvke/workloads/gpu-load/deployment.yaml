# A steady GPU load for the lab: fp16 matrix multiplies on the RTX 4080 in
# bursts (LOAD_SECONDS busy, IDLE_SECONDS idle), printing the measured
# TFLOPS after each burst. Scheduled by the KAI scheduler AICR installs, in
# its default queue at the preemptible train priority. Watch it:
#   kubectl -n gpu-load logs -f deploy/gpu-load
# and in Grafana / Prometheus: DCGM_FI_DEV_GPU_UTIL, DCGM_FI_DEV_POWER_USAGE.
# Stop it by setting replicas: 0 here (Argo CD reverts a kubectl scale).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-load
  namespace: gpu-load
  labels:
    app.kubernetes.io/name: gpu-load
spec:
  replicas: 1
  # One GPU: the old pod must release it before the new one can start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-load
        kai.scheduler/queue: default-queue
    spec:
      schedulerName: kai-scheduler
      # Preemptible: a Deployment defaults to KAI's inference priority (125),
      # which is non-preemptible and limited to the queue's quota, and
      # default-queue has none. train (50) may use idle GPUs and gives way
      # to higher-priority work.
      priorityClassName: train
      terminationGracePeriodSeconds: 5
      containers:
        - name: matmul
          image: docker.io/pytorch/pytorch:2.14.1-cuda13.2-cudnn9-runtime@sha256:c4ab67f95221a342dff0e8ca4543a7b8885f79f7a0029c0e2e39685d5eaf1722
          env:
            - {name: MATRIX_SIZE, value: "8192"}
            - {name: LOAD_SECONDS, value: "50"}
            - {name: IDLE_SECONDS, value: "10"}
          command: [python, -u, -c]
          args:
            - |
              import os, time, torch
              assert torch.cuda.is_available(), "no GPU visible"
              n = int(os.environ["MATRIX_SIZE"])
              busy, idle = float(os.environ["LOAD_SECONDS"]), float(os.environ["IDLE_SECONDS"])
              dev = torch.device("cuda")
              name = torch.cuda.get_device_name(0)
              a = torch.randn(n, n, device=dev, dtype=torch.float16)
              b = torch.randn(n, n, device=dev, dtype=torch.float16)
              print(f"{name}: {n}x{n} fp16 matmul, {busy:.0f}s on / {idle:.0f}s off", flush=True)
              while True:
                  start, done = time.time(), 0
                  while time.time() - start < busy:
                      for _ in range(10):
                          a @ b
                      torch.cuda.synchronize()
                      done += 10
                  elapsed = time.time() - start
                  print(f"{name}: {2 * n**3 * done / elapsed / 1e12:.1f} TFLOPS over {elapsed:.0f}s", flush=True)
                  time.sleep(idle)
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 4Gi, nvidia.com/gpu: 1}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
